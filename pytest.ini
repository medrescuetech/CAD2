[pytest]
testpaths = tests
python_files = test_*.py
python_functions = test_*
python_classes = Test*
addopts = -q --tb=short --json-report --json-report-file=reports/report.json --html=reports/report.html --self-contained-html
log_cli = true
log_cli_level = INFO
log_file = logs/pytest.log

# Register markers used by the harness
markers =
    e2e: end-to-end tests
    incidents: incident flows
    units: unit dispatch flows
    ampds: AMPDS CSV import
    locations: location CSV import
    mapping: map markers
    live_logs: live logging flows
    daily_logs: daily log flows
    permissions: role-based permissions
    reporting: reporting flows
    webhooks: webhook ingestion
