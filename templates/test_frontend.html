<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="app-config" content="{{ {
        'environment': config.get('ENV', 'production'),
        'debug': config.get('DEBUG', True),
        'testing': config.get('TESTING', True),
        'permissions': []
    }|tojson }}">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <title>Frontend Test - CAD System</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <!-- Theme CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}">
    
    <!-- jQuery (load before custom scripts) -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
    <div class="container mt-5">
        <div class="row">
            <div class="col-12">
                <div class="card">
                    <div class="card-header bg-primary text-white">
                        <h4>Frontend Test Results</h4>
                    </div>
                    <div class="card-body">
                        <div id="test-results" class="alert alert-info">
                            Running frontend tests... Check the browser console for detailed results.
                        </div>
                        <p>This page tests various frontend functions to identify issues with the template functions.</p>
                        <div id="alert-container"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Core Scripts (in order) -->
    <script src="{{ url_for('static', filename='js/utils.js') }}"></script>
    <script src="{{ url_for('static', filename='js/error_handler.js') }}"></script>
    <script src="{{ url_for('static', filename='js/theme_manager.js') }}"></script>
    <script src="{{ url_for('static', filename='js/test_frontend.js') }}"></script>
    
    <!-- Added missing showAlert function -->
    <script>
        // Define the missing showAlert function
        function showAlert(type, message, timeout = 5000) {
            console.log(`Alert triggered: ${type} - ${message}`);
            const alertContainer = document.getElementById('alert-container');
            if (!alertContainer) {
                console.error('Alert container not found');
                return;
            }
            
            // Create alert element
            const alertElement = document.createElement('div');
            alertElement.className = `alert alert-${type} alert-dismissible fade show`;
            alertElement.role = 'alert';
            alertElement.innerHTML = `
                ${message}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            `;
            
            // Add to container
            alertContainer.appendChild(alertElement);
            
            // Create Bootstrap alert instance
            const bsAlert = new bootstrap.Alert(alertElement);
            
            // Auto-dismiss after timeout
            if (timeout > 0) {
                setTimeout(() => {
                    try {
                        bsAlert.close();
                    } catch (e) {
                        console.error('Error closing alert:', e);
                        alertElement.remove();
                    }
                }, timeout);
            }
            
            // Add to test results
            const testResults = document.getElementById('test-results');
            if (testResults) {
                testResults.innerHTML += `<div>${type}: ${message}</div>`;
            }
        }
    </script>
</body>
</html>
