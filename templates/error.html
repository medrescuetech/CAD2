{% extends "base.html" %}

{% block title %}Error{% endblock %}

{% block content %}
<div class="error-container">
    <h1>Error</h1>
    <div class="error-message">
        {% if error %}
            {{ error }}
        {% else %}
            An error occurred. Please try again.
        {% endif %}
    </div>
    <div class="error-actions">
        <a href="{{ url_for('routes.index') }}" class="btn btn-primary">Return to Home</a>
    </div>
</div>
{% endblock %}

{% block styles %}
<style>
    .error-container {
        text-align: center;
        padding: 2rem;
        max-width: 600px;
        margin: 0 auto;
    }
    
    .error-message {
        margin: 2rem 0;
        padding: 1rem;
        background-color: #f8d7da;
        border: 1px solid #f5c6cb;
        border-radius: 4px;
        color: #721c24;
    }
    
    .error-actions {
        margin-top: 2rem;
    }
    
    .btn-primary {
        background-color: #007bff;
        border-color: #007bff;
        color: white;
        padding: 0.5rem 1rem;
        text-decoration: none;
        border-radius: 4px;
        display: inline-block;
    }
    
    .btn-primary:hover {
        background-color: #0056b3;
        border-color: #0056b3;
    }
</style>
{% endblock %}
