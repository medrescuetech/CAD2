{% extends "base.html" %}

{% block title %}System Logs{% endblock %}

{% block content %}
<div class="container-fluid">
    <div class="card">
        <div class="card-header">
            <h5 class="mb-0">System Logs</h5>
        </div>
        <div class="card-body">
            <div class="log-container" style="height: 600px; overflow-y: auto; background: #1e1e1e; color: #d4d4d4; padding: 1rem; font-family: monospace;">
                {% for log in logs %}
                    <div class="log-line">{{ log }}</div>
                {% else %}
                    <div class="text-muted">No logs available.</div>
                {% endfor %}
            </div>
        </div>
    </div>
</div>

<style>
.log-line {
    white-space: pre-wrap;
    word-wrap: break-word;
    margin-bottom: 0.25rem;
    line-height: 1.4;
}
.log-line:hover {
    background: rgba(255, 255, 255, 0.1);
}
</style>
{% endblock %}
