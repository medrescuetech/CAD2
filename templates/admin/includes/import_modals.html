{% if current_user.can(Permission.ADMINISTRATOR) %}
<!-- Users Import Modal -->
<div class="modal fade" id="importUsersModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Import Users</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <form action="{{ url_for('routes.import_users_csv') }}" method="post" enctype="multipart/form-data" class="import-form">
                <div class="modal-body">
                    <div class="mb-3">
                        <label for="usersFile" class="form-label">Select Users CSV File</label>
                        <input type="file" class="form-control" id="usersFile" name="file" accept=".csv" required>
                    </div>
                    <div class="progress d-none">
                        <div class="progress-bar progress-bar-striped progress-bar-animated" role="progressbar" style="width: 0%"></div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-primary">Import</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    // Handle form submissions
    document.querySelectorAll('.import-form').forEach(form => {
        form.addEventListener('submit', function(e) {
            const progressBar = this.querySelector('.progress');
            const progressBarInner = progressBar.querySelector('.progress-bar');
            const submitButton = this.querySelector('button[type="submit"]');
            
            // Show progress bar
            progressBar.classList.remove('d-none');
            submitButton.disabled = true;
            
            // Simulate progress (since we can't get real progress from form submit)
            let progress = 0;
            const interval = setInterval(() => {
                progress += 5;
                if (progress > 90) clearInterval(interval);
                progressBarInner.style.width = progress + '%';
            }, 100);
            
            // Clean up on form submission complete
            window.addEventListener('beforeunload', () => {
                clearInterval(interval);
            });
        });
    });
    
    // Reset progress bars when modals are hidden
    document.querySelectorAll('.modal').forEach(modal => {
        modal.addEventListener('hidden.bs.modal', function() {
            const progressBar = this.querySelector('.progress');
            const progressBarInner = this.querySelector('.progress-bar');
            const submitButton = this.querySelector('button[type="submit"]');
            
            progressBar.classList.add('d-none');
            progressBarInner.style.width = '0%';
            submitButton.disabled = false;
        });
    });
});
</script>
