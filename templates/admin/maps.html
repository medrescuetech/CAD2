{% extends "admin/base_admin.html" %}

{% block title %}Map Configuration{% endblock %}

{% block styles %}
{{ super() }}
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
{% endblock %}

{% block admin_content %}
<div class="container-fluid">
    <h1 class="h2 mb-4">Map Configuration</h1>

    <div class="row">
        <div class="col-12 col-lg-6">
            <div class="card">
                <div class="card-header">
                    <h5 class="card-title mb-0">Default Map Settings</h5>
                </div>
                <div class="card-body">
                    <form id="map-settings-form" method="POST">
                        <div class="mb-3">
                            <label for="default_lat" class="form-label">Default Latitude</label>
                            <input type="number" step="any" class="form-control" id="default_lat" name="default_lat" 
                                   value="{{ config.default_lat|default(37.7749) }}" required>
                        </div>
                        <div class="mb-3">
                            <label for="default_lng" class="form-label">Default Longitude</label>
                            <input type="number" step="any" class="form-control" id="default_lng" name="default_lng" 
                                   value="{{ config.default_lng|default(-122.4194) }}" required>
                        </div>
                        <div class="mb-3">
                            <label for="default_zoom" class="form-label">Default Zoom Level</label>
                            <input type="number" min="1" max="18" class="form-control" id="default_zoom" name="default_zoom" 
                                   value="{{ config.default_zoom|default(12) }}" required>
                        </div>
                        <button type="submit" class="btn btn-primary">Save Settings</button>
                    </form>
                </div>
            </div>
        </div>
        
        <div class="col-12 col-lg-6">
            <div class="card">
                <div class="card-header">
                    <h5 class="card-title mb-0">Preview</h5>
                </div>
                <div class="card-body">
                    <div id="preview-map" style="height: 400px;"></div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block admin_scripts %}
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
let map;
let marker;

function initMap() {
    const lat = parseFloat(document.getElementById('default_lat').value);
    const lng = parseFloat(document.getElementById('default_lng').value);
    const zoom = parseInt(document.getElementById('default_zoom').value);
    
    map = L.map('preview-map').setView([lat, lng], zoom);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap contributors'
    }).addTo(map);
    
    marker = L.marker([lat, lng], {
        draggable: true
    }).addTo(map);
    
    marker.on('dragend', function(e) {
        const position = marker.getLatLng();
        document.getElementById('default_lat').value = position.lat.toFixed(6);
        document.getElementById('default_lng').value = position.lng.toFixed(6);
    });
}

document.addEventListener('DOMContentLoaded', function() {
    initMap();
    
    // Update map when form values change
    ['default_lat', 'default_lng', 'default_zoom'].forEach(id => {
        document.getElementById(id).addEventListener('change', function() {
            const lat = parseFloat(document.getElementById('default_lat').value);
            const lng = parseFloat(document.getElementById('default_lng').value);
            const zoom = parseInt(document.getElementById('default_zoom').value);
            
            map.setView([lat, lng], zoom);
            marker.setLatLng([lat, lng]);
        });
    });
});
</script>
{% endblock %}
