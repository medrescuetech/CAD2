{% extends "base.html" %}
{% block styles %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/cad.css') }}">
{% endblock %}
{% block content %}
<div class="cad-console container-fluid py-3">
  <div class="card mb-2">
    <div class="card-header d-flex justify-content-between align-items-center">
      <h6 class="mb-0">Incidents</h6>
      <div>
        <button class="btn btn-outline-secondary btn-sm" onclick="load()">Run</button>
        <a class="btn btn-outline-primary btn-sm" id="csvBtn" href="#">Download CSV</a>
      </div>
    </div>
    <div class="card-body">
      <div class="row g-1">
        <div class="col-md-2"><select class="form-select form-select-sm" id="fStatus">
          <option value="">Lifecycle (all)</option><option>NEW</option><option>PENDING</option>
          <option>ASSIGNED</option><option>DISPATCHED</option><option>EN_ROUTE</option>
          <option>ON_SCENE</option><option>CLOSED</option><option>CANCELLED</option>
          <option>DUPLICATE_CANCELLED</option></select></div>
        <div class="col-md-2"><select class="form-select form-select-sm" id="fOwner">
          <option value="">Owner (all)</option><option>MAIN</option><option>EVENT</option>
          <option>CALL_TAKER</option></select></div>
        <div class="col-md-2"><input class="form-control form-control-sm" id="fPri"
          placeholder="Priority"></div>
        <div class="col-md-2"><select class="form-select form-select-sm" id="fOpen">
          <option value="">Open+closed</option><option value="1">Open only</option></select></div>
        <div class="col-md-2"><input class="form-control form-control-sm" id="fQ"
          placeholder="Search text"></div>
      </div>
    </div>
    <div class="card-body p-0">
      <table class="table table-sm table-hover mb-0">
        <thead><tr><th>#</th><th>Number</th><th>Pri</th><th>Lifecycle</th>
          <th>Owner</th><th>Location</th><th>Caller</th><th>Created</th><th>Closed</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
      <div id="empty" class="p-3 text-muted small" style="display:none">No incidents.</div>
    </div>
  </div>
</div>
<script>
const csrf = document.querySelector('meta[name="csrf-token"]').content;
const api = p => fetch('/api/core' + p, {headers: {'X-CSRF-Token': csrf}}).then(r => r.json());

function params() {
  const q = new URLSearchParams();
  if (fStatus.value) q.set('lifecycle_status', fStatus.value);
  if (fOwner.value) q.set('owning_application', fOwner.value);
  if (fPri.value) q.set('priority', fPri.value);
  if (fOpen.value) q.set('open', '1');
  q.set('limit', '200');
  return q;
}

async function load() {
  csvBtn.href = '/api/core/incidents.csv?' + params();
  let r;
  if (fQ.value.trim().length >= 2) {
    r = await api('/incidents/search?q=' + encodeURIComponent(fQ.value.trim()));
  } else {
    r = await api('/incidents?' + params());
  }
  const list = r.incidents || [];
  rows.innerHTML = '';
  empty.style.display = list.length ? 'none' : '';
  for (const i of list)
    rows.innerHTML += `<tr><td>${i.id}</td><td>${i.incident_number||''}</td>
      <td class="pri-${String(i.priority||'').toLowerCase()}">${i.priority||''}</td>
      <td><span class="st st-${(i.lifecycle_status||'').toLowerCase()}">${i.lifecycle_status||''}</span></td>
      <td>${i.owning_application||''}</td><td>${i.location||''}</td>
      <td>${i.caller||''}</td>
      <td>${(i.created_at||'').slice(0,16)}</td><td>${(i.closed_at||'').slice(0,16)}</td></tr>`;
}
load();
</script>
{% endblock %}
