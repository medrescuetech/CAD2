{% extends "base.html" %}

{% block title %}Reset User Password{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card mt-5">
                <div class="card-header bg-primary text-white">
                    <h3 class="text-center mb-0">
                        <i class="fas fa-key me-2"></i>Reset User Password
                    </h3>
                </div>
                <div class="card-body">
                    <p class="text-muted mb-3">
                        You are resetting the password for user: <strong>{{ user.username }}</strong>
                    </p>
                    <form id="resetPasswordForm" data-custom-submit="true">
                        <div class="mb-3">
                            <label for="new_password" class="form-label">New Password</label>
                            <input type="password" class="form-control" id="new_password" name="new_password" required>
                        </div>
                        <div class="mb-3">
                            <label for="confirm_password" class="form-label">Confirm Password</label>
                            <input type="password" class="form-control" id="confirm_password" name="confirm_password" required>
                        </div>
                        <div class="d-flex justify-content-between">
                            <button type="submit" class="btn btn-primary">Reset Password</button>
                            <a href="{{ url_for('routes.user_management') }}" class="btn btn-outline-secondary">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
document.addEventListener('DOMContentLoaded', function() {
    const form = document.getElementById('resetPasswordForm');
    form.addEventListener('submit', function(e) {
        e.preventDefault();
        if (!validateForm()) return;
        
        const button = form.querySelector('button[type="submit"]');
        if (button.disabled) return;
        
        button.disabled = true;
        button.innerHTML = '<i class="fas fa-spinner fa-spin me-1"></i> Resetting...';
        
        AdminManager.resetPassword(form).finally(() => {
            button.disabled = false;
            button.innerHTML = 'Reset Password';
        });
    });
});

function validateForm() {
    const newPassword = document.getElementById('new_password').value;
    const confirmPassword = document.getElementById('confirm_password').value;
    
    if (newPassword !== confirmPassword) {
        showAlert('error', 'New password and confirmation do not match');
        return false;
    }
    
    if (newPassword.length < 8) {
        showAlert('error', 'Password must be at least 8 characters long');
        return false;
    }
    
    return true;
}
</script>
{% endblock %}
