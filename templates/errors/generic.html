{% extends "base.html" %}

{% block title %}{{ error.code }} - Error{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6 text-center">
            <h1 class="display-1">{{ error.code }}</h1>
            <h2>{{ error.name }}</h2>
            <p class="lead">{{ error.description }}</p>
            <a href="{{ url_for('pages.index') }}" class="btn btn-primary">Return to Home</a>
        </div>
    </div>
</div>
{% endblock %}
