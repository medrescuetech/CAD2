{% extends "base.html" %}

{% block title %}403 - Forbidden{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-body text-center">
                    <h1 class="display-1 text-warning">403</h1>
                    <h2 class="mb-4">Access Forbidden</h2>
                    <p class="lead">Sorry, you don't have permission to access this page.</p>
                    <p>Please contact your administrator if you believe this is a mistake.</p>
                    <div class="mt-4">
                        <a href="{{ url_for('pages.index') }}" class="btn btn-primary">
                            <i class="fas fa-home me-2"></i>Return to Home
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
