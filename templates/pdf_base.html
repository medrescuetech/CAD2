<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>{% block title %}CAD System Report{% endblock %}</title>
    <style>
        @page {
            size: letter portrait;
            margin: 2cm;
            @top-center {
                content: "CAD System Report";
                font-size: 12pt;
            }
            @bottom-center {
                content: "Page " counter(page) " of " counter(pages);
                font-size: 10pt;
            }
        }
        body {
            font-family: Arial, sans-serif;
            font-size: 12pt;
            line-height: 1.5;
            color: #333;
        }
        h1 {
            font-size: 24pt;
            color: #1a1a1a;
            margin-top: 0;
            border-bottom: 1px solid #ccc;
            padding-bottom: 10px;
        }
        h2 {
            font-size: 18pt;
            color: #1a1a1a;
            margin-top: 20px;
            border-bottom: 1px solid #eee;
            padding-bottom: 5px;
        }
        .report {
            margin: 0 auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 15px 0;
        }
        th, td {
            padding: 8px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        th {
            background-color: #f2f2f2;
            font-weight: bold;
        }
        tr:nth-child(even) {
            background-color: #f9f9f9;
        }
        section {
            margin-bottom: 30px;
        }
        .footer {
            position: fixed;
            bottom: 0;
            width: 100%;
            text-align: center;
            font-size: 10pt;
            color: #666;
        }
        .header {
            position: fixed;
            top: 0;
            width: 100%;
            text-align: center;
            font-size: 10pt;
            color: #666;
        }
        .page-break {
            page-break-after: always;
        }
        .status-PENDING { color: #ff9800; }
        .status-ACTIVE { color: #4caf50; }
        .status-CLOSED { color: #666; }
        .status-CANCELED { color: #f44336; }
        .priority-1 { color: #f44336; font-weight: bold; }
        .priority-2 { color: #ff9800; font-weight: bold; }
        .priority-3 { color: #4caf50; }
    </style>
</head>
<body>
    {% block content %}{% endblock %}
</body>
</html>
